<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page introuvable | Mbaye Ndiaye</title>
<meta name="description" content="Cette page n'existe pas ou a été déplacée.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070d18">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://mbaye-ndiaye.vercel.app/">
<style>
  :root{
    --bg:#070d18; --bg-raised:#0f1a2e; --line:#1f2f4a;
    --text:#e8eef8; --text-dim:#9fb0c6; --text-faint:#5c6e8a;
    --teal:#2dd4bf; --cyan:#38bdf8; --violet:#818cf8;
    --grad:linear-gradient(135deg,#2dd4bf,#38bdf8 45%,#818cf8);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; flex-direction:column; justify-content:center;
    background:var(--bg);
    background-image:radial-gradient(ellipse 70% 45% at 50% -10%, rgba(56,189,248,.10), transparent);
    color:var(--text);
    font-family:'system-ui', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto; padding:0 28px; width:100%;}
  .code{
    font-family: ui-monospace,'Cascadia Mono','JetBrains Mono',monospace;
    color:var(--teal);
    font-size:14px; margin-bottom:18px; display:block;
  }
  .code::before{content:"~/"; color:var(--text-faint);}
  h1{
    font-size:clamp(2rem,6vw,3rem);
    margin:0 0 8px; letter-spacing:-0.01em;
    background:var(--grad);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  p{color:var(--text-dim); margin:0 0 28px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:4px;
    font-size:14px; font-weight:600; text-decoration:none;
    background:var(--grad); color:#04121a; border:none;
    transition:transform .2s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 16px 40px -18px rgba(45,212,191,.5);}
  .note{
    margin-top:36px; font-size:12.5px; color:var(--text-faint);
    font-family:ui-monospace,'Cascadia Mono','JetBrains Mono',monospace;
  }
  .note::after{content:"_"; color:var(--teal); animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:0;}}
</style>
</head>
<body>
  <div class="wrap">
    <span class="code">404: not found</span>
    <h1>Cette page n'existe pas.</h1>
    <p>L'adresse demandée est introuvable ou a été déplacée. Vérifiez l'URL ou revenez à la page d'accueil.</p>
    <a class="btn" href="/">← Retour à l'accueil</a>
    <p class="note">mbaye@fullstack:~$</p>
  </div>
</body>
</html>
